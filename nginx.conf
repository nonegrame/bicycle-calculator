server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /pacer {
        return 301 /pacer/;
    }

    location = /predict {
        return 301 /predict/;
    }

    location = /climb-power {
        return 301 /climb-power/;
    }

    # Keep the sitemap host-aware so the same image works with Cloud Run and
    # any production custom domain without publishing placeholder URLs.
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>https://$host/</loc></url>
  <url><loc>https://$host/pacer/</loc></url>
  <url><loc>https://$host/predict/</loc></url>
  <url><loc>https://$host/climb-power/</loc></url>
</urlset>';
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        return 200 "User-agent: *\nAllow: /\n\nSitemap: https://$host/sitemap.xml\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
